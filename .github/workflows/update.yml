name: Aggiorna calendario

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: football-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt

      - name: Scraping Serie B
        run: python scrapers/serie_b.py

      - name: Scraping Serie A
        run: python scrapers/serie_a.py

      - name: Scraping Champions League
        run: python scrapers/champions_league.py

      - name: Pubblica JSON aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento"
          else
            git commit -m "Aggiorna calendari calcio"
            git push
          fi
